spring.application.name=mbu-digital-library
# Hosts such as Render tell the app which port to use through the PORT variable.
server.port=${PORT:8080}

# When the app sits behind a host's HTTPS proxy, trust its forwarded headers (correct https links).
server.forward-headers-strategy=framework
# Set COOKIE_SECURE=true on a live site served over HTTPS.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Database (created by database/setup.sql).
# The password is NOT stored here. Put it in config/application.properties (copy
# config/application.example.properties) or set the DB_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mbu_library?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:mbu_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Template caching: off while developing, set THYMELEAF_CACHE=true on a live site.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# File uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=uploads

# Students below this attendance percentage get a warning
app.attendance.threshold=75

# Running Java, C and C++ programs on the server (see README, "Code editor").
# Python and SQL always run in the student's browser. Set APP_CODE_RUNNER_ENABLED=false on a public site.
app.code-runner.enabled=true

# Sample accounts (admin / faculty1 / student1) with PUBLIC passwords, created on first start.
# For a real deployment set this to false and give app.initial-admin-password instead.
app.seed-sample-accounts=true
app.initial-admin-password=

# Show the sample logins on the sign-in page (public demo sites only). Env: APP_SHOW_DEMO_LOGINS
app.show-demo-logins=false

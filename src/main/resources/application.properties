spring.application.name=mbu-digital-library
server.port=8080

# Database (created by database/setup.sql). Override with environment variables if needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mbu_library?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:mbu_app}
spring.datasource.password=${DB_PASSWORD:MbuApp@2026}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# File uploads (used from Phase 3 onwards)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=uploads

# Students below this attendance percentage get a warning
app.attendance.threshold=75

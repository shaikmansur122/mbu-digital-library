spring.application.name=mbu-digital-library
server.port=8080

# Database (created by database/setup.sql).
# The password is NOT stored here. Put it in config/application.properties (copy
# config/application.example.properties) or set the DB_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mbu_library?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:mbu_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# File uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=uploads

# Students below this attendance percentage get a warning
app.attendance.threshold=75

# Running Java, C and C++ programs on the server (see README, "Code editor")
app.code-runner.enabled=true

# Sample accounts (admin / faculty1 / student1) with PUBLIC passwords, created on first start.
# For a real deployment set this to false and give app.initial-admin-password instead.
app.seed-sample-accounts=true
app.initial-admin-password=

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student Dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar(${user})}"></header>

<main class="content">
    <div class="card">
        <h2>Welcome, <span th:text="${user.fullName}">Student</span></h2>
        <p>Roll no: <strong th:text="${user.rollNo}">-</strong>
           &middot; Department: <strong th:text="${user.department}">-</strong></p>
        <p>You are logged in as a <strong>student</strong>. The full layout (side menu, ID card, modules,
           lab experiments) is built in the next phases.</p>
    </div>
</main>
</body>
</html>

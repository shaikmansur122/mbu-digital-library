<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Faculty Dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar(${user})}"></header>

<main class="content">
    <div class="card">
        <h2>Welcome, <span th:text="${user.fullName}">Faculty</span></h2>
        <p>Department: <strong th:text="${user.department}">-</strong></p>
        <p>You are logged in as <strong>faculty</strong>. Upload tools, student results and lab
           submissions are built in the next phases.</p>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<!--
  Shared page shell for students and faculty (same interface, as in the design sketch):
  top bar with logo (top right) and nav, left side menu, main content, right-hand ID card.
  Pages use it like:  <html th:replace="~{fragments/shell :: shell('Title', 'activeKey', ~{::main})}">
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="shell(title, active, content)">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>

<header th:replace="~{fragments/layout :: topbar(${me})}"></header>

<!-- Title bar features: Home | Modules | Lab Experiments | Tools | Resources -->
<nav class="topnav" aria-label="Main">
    <a th:href="@{/home}"      th:classappend="${active == 'home'} ? 'active'">Home</a>
    <a th:href="@{/modules}"   th:classappend="${active == 'modules'} ? 'active'">Modules</a>
    <a th:href="@{/labs}"      th:classappend="${active == 'labs'} ? 'active'">Lab Experiments</a>
    <a th:href="@{/tools}"     th:classappend="${active == 'tools'} ? 'active'">Tools</a>
    <a th:href="@{/resources}" th:classappend="${active == 'resources'} ? 'active'">Resources</a>
</nav>

<div class="shell">

    <!-- Left side menu -->
    <aside class="sidebar" aria-label="Side menu">
        <a th:href="@{/modules}"     th:classappend="${active == 'modules'} ? 'active'"><span class="ico">&#128218;</span>Modules</a>
        <a th:href="@{/labs}"        th:classappend="${active == 'labs'} ? 'active'"><span class="ico">&#129514;</span>Lab Exp</a>
        <a th:href="@{/tools}"       th:classappend="${active == 'tools'} ? 'active'"><span class="ico">&#128295;</span>Tools</a>
        <a th:href="@{/results}"     th:classappend="${active == 'results'} ? 'active'"><span class="ico">&#127942;</span>Results</a>
        <a th:href="@{/codes}"       th:classappend="${active == 'codes'} ? 'active'"><span class="ico">&#128190;</span>Codes</a>
        <a th:href="@{/editor}"      th:classappend="${active == 'editor'} ? 'active'"><span class="ico">&#128187;</span>Editor</a>
        <hr>
        <a th:href="@{/attendance}"  th:classappend="${active == 'attendance'} ? 'active'"><span class="ico">&#128197;</span>Attendance</a>
        <a th:href="@{/marks}"       th:classappend="${active == 'marks'} ? 'active'"><span class="ico">&#128221;</span>Marks</a>
        <a th:href="@{/assignments}" th:classappend="${active == 'assignments'} ? 'active'"><span class="ico">&#128194;</span>Assignments</a>
    </aside>

    <!-- Main content comes from the page -->
    <div class="main" th:replace="${content}"></div>

    <!-- Right side: ID card, then faculty card -->
    <aside class="rightbar" aria-label="Profile cards" th:if="${me != null}">

        <section class="idcard">
            <div class="idcard-head">ID Card</div>
            <div class="avatar-wrap">
                <img th:if="${me.photoFile != null}" class="avatar"
                     th:src="@{/files/photos/{f}(f=${me.photoFile})}" alt="Photo">
                <div th:unless="${me.photoFile != null}" class="avatar placeholder" th:text="${me.initial}">A</div>
            </div>
            <dl>
                <dt>Name</dt><dd th:text="${me.fullName}">Name</dd>
                <th:block th:if="${me.rollNo != null}">
                    <dt>Roll No</dt><dd th:text="${me.rollNo}">-</dd>
                </th:block>
                <th:block th:if="${me.role.name() == 'FACULTY'}">
                    <dt>Role</dt><dd>Faculty</dd>
                </th:block>
                <th:block th:if="${mySubjects != null}">
                    <dt>Subject</dt><dd th:text="${mySubjects}">-</dd>
                </th:block>
                <th:block th:if="${me.semester != null}">
                    <dt>Semester</dt><dd th:text="${me.semester}">-</dd>
                </th:block>
                <th:block th:if="${me.section != null}">
                    <dt>Section</dt><dd th:text="${me.section}">-</dd>
                </th:block>
                <th:block th:if="${me.department != null}">
                    <dt>Dept</dt><dd th:text="${me.department}">-</dd>
                </th:block>
            </dl>
            <a class="card-link" th:href="@{/profile}">Edit profile &amp; photo</a>
        </section>

        <section class="idcard faculty-card" th:if="${me.mentor != null}">
            <div class="idcard-head">Faculty</div>
            <dl>
                <dt>Name</dt><dd th:text="${me.mentor.fullName}">Faculty</dd>
            </dl>
            <!-- Logo buttons: click to open GitHub, LinkedIn or the resume (dimmed when not added) -->
            <div class="social" th:with="m=${me.mentor}">
                <a th:if="${m.githubUrl != null}" class="social-btn github" th:href="${m.githubUrl}"
                   target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                </a>
                <span th:unless="${m.githubUrl != null}" class="social-btn disabled" title="GitHub: not added yet">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                </span>

                <a th:if="${m.linkedinUrl != null}" class="social-btn linkedin" th:href="${m.linkedinUrl}"
                   target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                </a>
                <span th:unless="${m.linkedinUrl != null}" class="social-btn disabled" title="LinkedIn: not added yet">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                </span>

                <!-- Resume: the uploaded PDF if there is one, otherwise the resume link -->
                <a th:if="${m.resumeFile != null or m.resumeUrl != null}" class="social-btn resume"
                   th:href="${m.resumeFile != null} ? @{/files/resumes/{f}(f=${m.resumeFile})} : ${m.resumeUrl}"
                   target="_blank" rel="noopener noreferrer" title="Resume" aria-label="Resume">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5L13 3.5zM7 13h10v1.6H7V13zm0 3.4h10V18H7v-1.6zM7 9.6h4v1.6H7V9.6z"/></svg>
                </a>
                <span th:unless="${m.resumeFile != null or m.resumeUrl != null}" class="social-btn disabled" title="Resume: not added yet">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5L13 3.5zM7 13h10v1.6H7V13zm0 3.4h10V18H7v-1.6zM7 9.6h4v1.6H7V9.6z"/></svg>
                </span>
            </div>
            <a class="card-link" th:href="@{/people/{id}(id=${me.mentor.id})}">View more</a>
        </section>

    </aside>
</div>

</body>
</html>

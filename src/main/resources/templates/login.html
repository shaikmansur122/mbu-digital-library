<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<div class="login-wrap">
    <header th:replace="~{fragments/layout :: topbar(null)}"></header>

    <main class="login-main">
        <div class="card login-card">
            <div class="welcome">
                <h2>Welcome back</h2>
                <p>Sign in to continue to your digital library</p>
            </div>

            <div class="alert err" th:if="${param.error}">Invalid username or password.</div>
            <div class="alert ok" th:if="${param.logout}">You have been logged out.</div>

            <form th:action="@{/login}" method="post">
                <div class="field">
                    <label for="username">Username / Roll number</label>
                    <input id="username" name="username" type="text" autofocus required autocomplete="username">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn">Log in</button>
            </form>

            <!-- Shown only when app.show-demo-logins=true (public demo sites) -->
            <div class="hint demo" th:if="${showDemoLogins}">
                <strong>Demo logins</strong><br>
                Admin: <code>admin</code> / <code>Admin@123</code><br>
                Faculty: <code>faculty1</code> / <code>Faculty@123</code><br>
                Student: <code>student1</code> / <code>Student@123</code>
            </div>
            <p class="hint" th:unless="${showDemoLogins}">Don't have an account? Accounts are created by the university admin.</p>
        </div>
    </main>
</div>
</body>
</html>
